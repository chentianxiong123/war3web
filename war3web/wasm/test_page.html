<!doctype html>
<meta charset="utf-8">
<title>war3core wasm 浏览器加载测试</title>
<h1>war3core wasm 浏览器加载测试</h1>
<pre id="log">loading…</pre>
<script type="module">
  // 双模式：优先 Emscripten 模块（war3core.mjs，MODULARIZE）；
  // 没有/加载失败则回退 zig 裸 wasm（war3core.wasm，fetch + instantiate）。
  async function loadCore() {
    try {
      const r = await fetch('./out/war3core.mjs');
      if (r.ok) {
        const mod = await import('./out/war3core.mjs');
        const create = mod.default ?? mod.createWar3Core;
        const m = await create();
        return {
          mode: 'Emscripten',
          add: m._add.bind(m), multiply: m._multiply.bind(m), fib: m._fib.bind(m),
        };
      }
    } catch (e) { /* 回退裸 wasm */ }
    const buf = await (await fetch('./out/war3core.wasm')).arrayBuffer();
    const { instance } = await WebAssembly.instantiate(buf);
    return { mode: 'zig bare', ...instance.exports };
  }

  loadCore().then((core) => {
    const checks = [
      ['add(2, 3)', core.add(2, 3), 5],
      ['add(-5, 5)', core.add(-5, 5), 0],
      ['multiply(6, 7)', core.multiply(6, 7), 42],
      ['fib(10)', core.fib(10), 55],
      ['fib(1)', core.fib(1), 1],
    ];
    let ok = 0, bad = 0;
    const lines = checks.map(([name, got, want]) => {
      const pass = got === want;
      if (pass) ok++; else bad++;
      return `${pass ? 'ok  ' : 'FAIL'} ${name} = ${got}${pass ? '' : ' (want ' + want + ')'}`;
    });
    lines.push(`\nmode: ${core.mode}`);
    lines.push(`${ok} passed, ${bad} failed`);
    document.getElementById('log').textContent = lines.join('\n');
    document.body.dataset.passed = bad === 0 ? 'yes' : 'no';
  }).catch((e) => {
    document.getElementById('log').textContent = '加载失败: ' + e;
    document.body.dataset.passed = 'no';
  });
</script>
